# Application
spring.application.name=CrisesManagment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Datasource (PostgreSQL) - prefer setting DB_URL, DB_USER and DB_PASSWORD as environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CrisesManagment}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_HBM2DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Gemini (Generative Language API)
# Provide GEMINI_API_KEY as an environment variable. If not set, the client bean will still be created but requests will fail until a key is provided.
gemini.api.key=${GEMINI_API_KEY:}
# Model name used by GeminiExtractionService. The base URL is fixed
# (https://generativelanguage.googleapis.com) in WebClientConfig; only the
# model segment of the path is configurable here, so a model retirement/
# upgrade is a one-line config change, not a code change.
gemini.api.model=${GEMINI_API_MODEL:gemini-3.6-flash}

# Groq (used to cross-check headline extraction against Gemini).
# When set, GeminiExtractionService calls BOTH Gemini and Groq for every
# headline and reconciles the two answers (averaged severity/duration,
# majority-agreed eventType and route) instead of trusting a single
# response. Leave GROQ_API_KEY unset to keep the old single-key behavior.
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-120b}

# Weather (Open-Meteo ? free, no API key required)
weather.api.base-url=${WEATHER_API_BASE_URL:https://api.open-meteo.com}
# Wind speed (km/h) at a route's origin above which we flag the route as weather-disrupted.
weather.risk.wind-threshold-kph=${WEATHER_WIND_THRESHOLD_KPH:45}

# Server
# Railway (and most PaaS platforms) inject the port to bind to as PORT, not
# SERVER_PORT ? so PORT is checked first. SERVER_PORT stays as a fallback for
# local/other environments that still set it directly, and 8080 is the last
# resort default.
server.port=${PORT:${SERVER_PORT:8080}}

# DevTools auto-restart-on-save is off by default: every restart re-fires the
# GDELT news poller's @Scheduled job immediately, and a few restarts close
# together can burst GDELT with requests from this IP faster than its
# 1-per-5-seconds limit (even though in-app spacing between routes is fine).
# Set DEVTOOLS_RESTART_ENABLED=true as an env var if you want hot-reload back.
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Market data (EIA ? free key, sign up at https://www.eia.gov/opendata/register.php)
eia.api.key=${EIA_API_KEY:}

# Deployed frontend's origin, used by CorsConfig to allow it in production
# (e.g. https://your-frontend.up.railway.app). Leave unset for local dev.
frontend.url=${FRONTEND_URL:}