# Application
spring.application.name=CrisesManagment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Datasource (PostgreSQL) - prefer setting DB_URL, DB_USER and DB_PASSWORD as environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CrisesManagment}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_HBM2DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Gemini (Generative Language API)
# Provide GEMINI_API_KEY as an environment variable. If not set, the client bean will still be created but requests will fail until a key is provided.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}

# Server
server.port=${SERVER_PORT:8080}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Market data (EIA — free key, sign up at https://www.eia.gov/opendata/register.php)
eia.api.key=${EIA_API_KEY:}